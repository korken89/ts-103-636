[package]
name = "ts-103-636"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "DECT-2020 NR+ (ETSI TS 103 636) typed parsers, builders, and Mode 1 security helpers for the MAC and PHY layers"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["dect", "etsi", "wireless", "mac", "no-std"]
categories = ["embedded", "no-std", "network-programming", "parser-implementations"]
repository = "https://github.com/korken89/ts-103-636"
authors = ["Emil Fresk <emil.fresk@gmail.com>"]
exclude = [
    "*.pdf",
    "standards/",
    ".jj/",
    "fuzz/",
    "codegen/",
]

[dependencies]
embedded-io = "0.7"
heapless = { version = "0.9", default-features = false }
subtle = { version = "2.6", default-features = false }
aes = { version = "0.8", default-features = false, optional = true }
cmac = { version = "0.7", default-features = false, optional = true }
ctr = { version = "0.9", default-features = false, optional = true }
defmt = { version = "1", optional = true }

[features]
default = ["software-crypto"]
# Bundle the RustCrypto-based [`SoftwareCrypto`] AES-128 backend. Disable
# this feature when you are providing a hardware [`MacCrypto`] backend
# and want to skip the software crypto dependencies entirely.
software-crypto = ["dep:aes", "dep:cmac", "dep:ctr"]
defmt = ["dep:defmt", "embedded-io/defmt", "heapless/defmt"]
